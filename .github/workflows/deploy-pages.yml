name: Deploy ATS Flights to GitHub Pages
on:
  push:
    branches: [claude/scroll-hero-video-component-vnorx7]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/ats-flights/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: projects/ats-flights
      - name: Build static export
        run: npm run build
        working-directory: projects/ats-flights
        env:
          NEXT_PUBLIC_BASE_PATH: /ui-ux-pro-max-skill
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: projects/ats-flights/out
      - id: deployment
        uses: actions/deploy-pages@v4
