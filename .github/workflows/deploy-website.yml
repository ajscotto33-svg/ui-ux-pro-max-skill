name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/higgsfield-seedance-video-23k2du
    paths:
      - "projects/andrew-scotto-realty/**"
      - "projects/azure-estates/**"
      - "projects/as-yachts/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Three sites, one Pages deployment:
      #   /        -> Andrew Scotto | Douglas Elliman (original, unchanged)
      #   /azure/  -> Azure Estates (neutral branding)
      #   /yachts/ -> AS Yachts (luxury yacht brokerage)
      - name: Assemble site bundle
        run: |
          mkdir -p _site/azure _site/yachts
          cp -r projects/andrew-scotto-realty/. _site/
          cp -r projects/azure-estates/. _site/azure/
          cp -r projects/as-yachts/. _site/yachts/

      # For each site: bake in its hero video (all-keyframe mp4 fallback)
      # and extract the JPEG frame sequence that powers the canvas scrub.
      # continue-on-error: an expired CDN link must not block the deploy —
      # the page falls back to its remote video source in the browser.
      - name: Prepare hero videos
        continue-on-error: true
        run: |
          command -v ffmpeg >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          }
          # prepare <dir> <url> [trim-seconds] [speed-factor]
          # trim: keep only the first N seconds of the source
          # speed: play the footage this much faster (1 = unchanged)
          prepare() {
            sitedir="$1"; url="$2"; trim="${3:-}"; speed="${4:-1}"
            mkdir -p "$sitedir/assets"
            curl -fL --retry 3 --max-time 180 \
              -o "$sitedir/assets/hero-original.mp4" "$url" || return 0
            (
              cd "$sitedir/assets"
              TRIMARG=""
              [ -n "$trim" ] && TRIMARG="-t $trim"
              ffmpeg -y $TRIMARG -i hero-original.mp4 -an \
                -vf "setpts=PTS/$speed" \
                -c:v libx264 -profile:v high -crf 23 \
                -g 1 -keyint_min 1 -sc_threshold 0 \
                -pix_fmt yuv420p -movflags +faststart \
                hero.mp4 || cp hero-original.mp4 hero.mp4
              mkdir -p frames
              if ffmpeg -y $TRIMARG -i hero-original.mp4 -vf "setpts=PTS/$speed,fps=15,scale=1600:-2" -q:v 3 frames/frame_%04d.jpg; then
                COUNT=$(ls frames/frame_*.jpg | wc -l | tr -d ' ')
                printf '{"count": %s}\n' "$COUNT" > frames/manifest.json
                echo "$sitedir: extracted $COUNT frames"
              else
                rm -rf frames
              fi
              rm -f hero-original.mp4
            )
          }
          prepare "_site" \
            "https://d8j0ntlcm91z4.cloudfront.net/user_3GIGRwFkw7yyzrAmJxMkkQFlLZP/hf_20260714_135642_55558543-6c58-47e0-b1d1-e032b1111a69.mp4"
          # Azure: drop the static tail (keep 11s) and run slightly faster
          prepare "_site/azure" \
            "https://d8j0ntlcm91z4.cloudfront.net/user_3GIGRwFkw7yyzrAmJxMkkQFlLZP/hf_20260714_150621_fe761e14-cf7f-4043-a8fc-e1bc99ba797c.mp4" \
            11 1.15
          # AS Yachts: full 14s continuous drone journey (200ft side-angle)
          prepare "_site/yachts" \
            "https://d8j0ntlcm91z4.cloudfront.net/user_3GIGRwFkw7yyzrAmJxMkkQFlLZP/hf_20260714_191448_f6c93475-3080-411f-915d-bc8467db69ee.mp4"
          du -sh _site _site/azure _site/yachts || true

      # AS Yachts: pull editorial stills straight from the hero footage.
      # The journey (approach -> hull -> aft -> deck -> salon -> foredeck)
      # gives us six first-party photos for the cards, gallery and detail
      # page. All backgrounds have a CSS gradient fallback, so a missing
      # still degrades to an intentional gradient rather than a broken image.
      - name: Prepare AS Yachts stills
        continue-on-error: true
        run: |
          command -v ffmpeg >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          }
          STILLS="_site/yachts/assets/stills"
          mkdir -p "$STILLS"
          SRC="https://d8j0ntlcm91z4.cloudfront.net/user_3GIGRwFkw7yyzrAmJxMkkQFlLZP/hf_20260714_191448_f6c93475-3080-411f-915d-bc8467db69ee.mp4"
          if curl -fL --retry 3 --max-time 180 -o /tmp/yhero.mp4 "$SRC"; then
            grab() { ffmpeg -y -ss "$1" -i /tmp/yhero.mp4 -frames:v 1 -vf "scale=1600:-2" -q:v 3 "$STILLS/$2.jpg" || true; }
            grab 1.5  still-approach
            grab 4.0  still-hull
            grab 6.5  still-aft
            grab 8.5  still-deck
            grab 10.5 still-salon
            grab 13.0 still-foredeck
            rm -f /tmp/yhero.mp4
          fi
          ls -la "$STILLS" || true

      # Property, interior, and neighborhood photography for the Azure site.
      # Fetched at deploy time and converted to JPG (CDN links can expire;
      # the page markup degrades gracefully to gradients if any are missing).
      - name: Prepare Azure images
        continue-on-error: true
        run: |
          command -v ffmpeg >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          }
          IMGDIR="_site/azure/assets/img"
          mkdir -p "$IMGDIR"
          BASE="https://d8j0ntlcm91z4.cloudfront.net/user_3GIGRwFkw7yyzrAmJxMkkQFlLZP"
          fetch_img() {
            name="$1"; url="$2"
            if curl -fL --retry 3 --max-time 60 -o "/tmp/$name.src" "$url"; then
              ffmpeg -y -i "/tmp/$name.src" -q:v 3 "$IMGDIR/$name.jpg" \
                || cp "/tmp/$name.src" "$IMGDIR/$name.jpg"
            fi
          }
          fetch_img prop-bayfront    "$BASE/hf_20260714_152312_42f564c4-f6d7-4ff5-9c4d-55f50d74b49b.png"
          fetch_img prop-penthouse   "$BASE/hf_20260714_152321_ea634718-b2a6-472f-ada1-c4448074db36.png"
          fetch_img prop-villa       "$BASE/hf_20260714_152331_686ce2a5-0b0c-419b-92c2-e5225de6c81c.png"
          fetch_img about-interior   "$BASE/hf_20260714_152339_df20193c-1d45-4682-bf0b-42c6ab417efd.png"
          fetch_img hood-miami-beach "$BASE/hf_20260714_152355_d25575a3-911c-4b37-9f80-fc77493ddc06.png"
          fetch_img hood-brickell    "$BASE/hf_20260714_152403_7e1f146f-0f1f-4879-8bc0-229d0ea51cf2.png"
          fetch_img hood-coral-gables "$BASE/hf_20260714_152412_445e26f7-bc15-4909-8ec3-2d5479cfed8b.png"
          fetch_img hood-key-biscayne "$BASE/hf_20260714_152423_3caf6df1-600a-4210-a6f0-f3b69ab39799.png"
          ls -la "$IMGDIR" || true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
